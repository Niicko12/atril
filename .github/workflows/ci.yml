name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  calidad:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Lint (incluye límites de estructura)
        run: npm run lint
      - name: Capas y ciclos
        run: npm run depcruise
      - name: Archivos por módulo
        run: npm run check:modules
      - name: Tests y cobertura
        run: npm run test -- --coverage
      - name: Modelo Basic Pitch real (CPU, sin cobertura)
        run: npm run test:model
      - name: Build y presupuesto de bundle
        run: npm run build

  navegador:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    needs: calidad
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Instalar Chromium y WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Recorridos de navegador
        run: npm run e2e
      - name: Informe y trazas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pruebas-navegador
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
